## SonarCloud project configuration
## Do NOT commit tokens or secrets. Set them as GitHub secrets (e.g. SONAR_TOKEN).
## This file must be at the repository root so the SonarScanner CLI detects it.
sonar.projectKey=santiagowuerich_ci-cd
sonar.organization=santiagowuerich
sonar.host.url=https://sonarcloud.io
sonar.sources=.
sonar.tests=test
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.test.js,**/*.spec.js,node_modules/**
sonar.exclusions=node_modules/**,dist/**,coverage/**,.github/**

# If you prefer the action to pass properties, remove or override these here.