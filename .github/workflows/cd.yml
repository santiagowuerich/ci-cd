name: CD Pipeline

on:
  workflow_run:
    workflows:
      - CI Pipeline
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'

    steps:
      - name: Mostrar rama
        run: |
          echo "Rama detectada: ${{ github.event.workflow_run.head_branch }}"

      - name: Deploy Main
        if: github.event.workflow_run.head_branch == 'main'
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "Falta configurar VERCEL_DEPLOY_HOOK"
            exit 1
          fi

          curl --fail --show-error --request POST "$VERCEL_DEPLOY_HOOK"

      - name: Deploy Develop
        if: github.event.workflow_run.head_branch == 'develop'
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_DEVELOP }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "Falta configurar VERCEL_DEPLOY_HOOK_DEVELOP"
            exit 1
          fi

          curl --fail --show-error --request POST "$VERCEL_DEPLOY_HOOK"