name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]   # ← Nombre exacto del ci.yml
    types:
      - completed
    branches:
      - main
      - develop

jobs:
  cd:
    runs-on: ubuntu-latest
    # Solo corre si el CI pasó exitosamente
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      # ── DEPLOY A VERCEL ───────────────────────────────────
      - name: Deploy a Vercel (Main)
        if: github.event.workflow_run.head_branch == 'main'
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: curl -X POST "$VERCEL_DEPLOY_HOOK"

      - name: Deploy a Vercel (Develop)
        if: github.event.workflow_run.head_branch == 'develop'
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_DEVELOP }}
        run: curl -X POST "$VERCEL_DEPLOY_HOOK"

      # ✅ NOTIFICACIÓN SLACK - DEPLOY ÉXITO
      - name: Notificar Slack - Deploy Exitoso
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
          -H 'Content-type: application/json' \
          --data '{
            "text": "🚀 *Deploy exitoso a Vercel!*",
            "attachments": [{
              "color": "#36a64f",
              "fields": [
                {"title":"Rama", "value":"'"$BRANCH"'", "short":true},
                {"title":"Autor", "value":"'"$ACTOR"'", "short":true},
                {"title":"Status", "value":"Deploy OK ✅", "short":false}
              ]
            }]
          }'

      # ❌ NOTIFICACIÓN SLACK - DEPLOY FALLA
      - name: Notificar Slack - Deploy Fallido
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
          -H 'Content-type: application/json' \
          --data '{
            "text": "❌ *Deploy FALLIDO en Vercel!*",
            "attachments": [{
              "color": "#ff0000",
              "fields": [
                {"title":"Rama", "value":"'"$BRANCH"'", "short":true},
                {"title":"Status", "value":"Deploy fallido ❌", "short":false}
              ]
            }]
          }'