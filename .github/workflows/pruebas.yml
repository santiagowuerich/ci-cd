name: CI/CD Pipeline Completo

on:
  push:
    branches: 
      - main
      - develop
      - 'JIRA-*'
  pull_request:
    branches: 
      - main
      - develop

jobs:
  ci-cd:
    runs-on: ubuntu-latest

    steps:
      # ── STAGE 1: CHECKOUT ─────────────────────────────────
      - name: Obtener código del repositorio
        uses: actions/checkout@v3

      # ── STAGE 2: SETUP PNPM ──────────────────────────────
      - name: Instalar pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      # ── STAGE 3: SETUP NODE (con cache pnpm) ─────────────
      - name: Configurar Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'pnpm'

      # ── STAGE 4: INSTALAR DEPENDENCIAS ───────────────────
      # --frozen-lockfile: usa exactamente las versiones del lockfile
      - name: Instalar dependencias
        run: pnpm install

      # ── STAGE 5: BUILD ────────────────────────────────────
      - name: Ejecutar Build
        run: pnpm run build

      # ── STAGE 6: TESTS ────────────────────────────────────
      - name: Ejecutar Tests automatizados
        run: pnpm test -- --coverage

      # ── STAGE 6.5: SONARCLOUD ANALYSIS ────────────────────────────────────
      - name: Analizar con SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Wait for SonarCloud Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONARQUBE_HOST_URL: https://sonarcloud.io

      # ── STAGE 7: EXTRAER ISSUE KEY DE JIRA ────────────────────────────────────
      - name: Extraer issue key de Jira
        id: jira
        if: always()
        env:
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
        run: |
          ISSUE_KEY=$(echo "${{ github.ref_name }}" | grep -oE "${JIRA_PROJECT_KEY}-[0-9]+" | head -1)
          echo "issue_key=$ISSUE_KEY" >> $GITHUB_OUTPUT
          echo "Issue Jira detectado: $ISSUE_KEY"

      # ── STAGE 8: DEPLOY A VERCEL (solo si los tests pasan y sonarqube tambien) ─────────────────
      - name: Deploy a Vercel
        if: success() && github.ref == 'refs/heads/main'
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: curl -X POST "$VERCEL_DEPLOY_HOOK"
      
      # ✅ NOTIFICACIÓN SLACK - ÉXITO
      - name: Notificar Slack - Éxito
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
          -H 'Content-type: application/json' \
          --data '{
            "text": "✅ *Pipeline Exitoso - Vercel desplegando!*",
            "attachments": [{
              "color": "#36a64f",
              "fields": [
                {"title":"Repositorio", "value":"'"$REPO"'", "short":true},
                {"title":"Autor", "value":"'"$ACTOR"'", "short":true},
                {"title":"Rama", "value":"'"$BRANCH"'", "short":true},
                {"title":"Commit", "value":"'"$COMMIT"'", "short":true},
                {"title":"Comentario del commit", "value":"'"$MESSAGE"'", "short":false},
                {"title":"Status", "value":"Tests OK ✅ → Deploy OK ✅", "short":false}
              ]
            }]
          }'

      # ❌ NOTIFICACIÓN SLACK - FALLA
      - name: Notificar Slack - Falla
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
          -H 'Content-type: application/json' \
          --data '{
            "text": "❌ *Pipeline FALLIDO - Deploy CANCELADO*",
            "attachments": [{
              "color": "#ff0000",
              "fields": [
                {"title":"Repositorio", "value":"'"$REPO"'", "short":true},
                {"title":"Autor", "value":"'"$ACTOR"'", "short":true},
                {"title":"Rama", "value":"'"$BRANCH"'", "short":true},
                {"title":"Commit", "value":"'"$COMMIT"'", "short":true},
                {"title":"Comentario del commit", "value":"'"$MESSAGE"'", "short":false},
                {"title":"Status", "value":"Pipeline fallido ❌ → Deploy cancelado", "short":false}
              ]
            }]
          }'

      # ── JIRA: COMENTARIO SI EL PIPELINE FUE EXITOSO ───
      - name: Comentar en Jira - Éxito
        if: success() && steps.jira.outputs.issue_key != ''
        env:
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          ISSUE_KEY: ${{ steps.jira.outputs.issue_key }}
        run: |
          curl -s -X POST \
            -u "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            "$JIRA_BASE_URL/rest/api/3/issue/$ISSUE_KEY/comment" \
            --data '{
              "body": {
                "type": "doc",
                "version": 1,
                "content": [
                  {
                    "type": "paragraph",
                    "content": [
                      {
                        "type": "text",
                        "text": "✅ Pipeline exitoso en GitHub Actions. Build, tests y deploy completados correctamente."
                      }
                    ]
                  }
                ]
              }
            }'

      # ── JIRA: COMENTARIO SI EL PIPELINE FALLÓ ─────────
      - name: Comentar en Jira - Falla
        if: failure() && steps.jira.outputs.issue_key != ''
        env:
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          ISSUE_KEY: ${{ steps.jira.outputs.issue_key }}
        run: |
          curl -s -X POST \
            -u "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            "$JIRA_BASE_URL/rest/api/3/issue/$ISSUE_KEY/comment" \
            --data '{
              "body": {
                "type": "doc",
                "version": 1,
                "content": [
                  {
                    "type": "paragraph",
                    "content": [
                      {
                        "type": "text",
                        "text": "❌ Pipeline fallido en GitHub Actions. Revisar los logs de build, tests o deploy."
                      }
                    ]
                  }
                ]
              }
            }'